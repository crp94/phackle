name: e2e

# Deliberately its OWN workflow, not a job bolted onto test.yml: browser-infra
# flakiness (a chromium download hiccup, a webServer boot timeout) must never
# be able to mask a real unit-test failure, and vice versa — each gives an
# independent, unambiguous status check.
on:
  push:
  pull_request:

permissions:
  contents: read

# GR6 gr6-118, and this is the workflow that made the finding: each run is a
# production build plus a preview server plus the whole spec set, and a push
# train of three commits used to run three of them to completion when only the
# last one's verdict would ever be looked at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action pinning: see the recorded decision in test.yml.

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # GR6 gr6-048: three engines, not one. playwright.config.ts runs the full
      # spec set on chromium and e2e/determinism.spec.ts additionally on firefox
      # and webkit — `Math.exp`/`Math.log` are implementation-approximated in
      # ECMA-262, so V8, SpiderMonkey and JavaScriptCore are the only three
      # places the cross-realm claim can actually be tested. The two extra
      # engines are a one-time download on a cold cache; the extra specs
      # themselves measured +8s of suite time locally (27.6s -> 35.6s).
      - name: install browsers (+ OS deps)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: e2e (playwright test — builds + previews the app itself)
        run: npm run e2e

      # playwright.config.ts's html reporter bundles its referenced traces
      # and screenshots into playwright-report/ itself, so this one folder is
      # a self-contained, browsable artifact of what failed and why.
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
