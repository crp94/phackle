<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Theme-flash boot script (task T21, ledgered from T5). Stamps
      data-theme on <html> BEFORE first paint, from the same storage key and
      'paper'|'dark' -> 'light'|'dark' mapping as
      src/i18n/LocaleProvider.tsx's domTheme()/systemTheme() -- see that
      file's comments for why 'paper' is the settings-schema name and
      'light' is the DOM contract. This is a duck-typed, best-effort read of
      the same phackle.v1 key storage.ts owns; it never writes, so a wrong
      guess (corrupt JSON, private-browsing lockout) is harmless and gets
      corrected the instant LocaleProvider's own useLayoutEffect runs. The
      inner try/catch isolates the storage read (localStorage may throw
      outright, e.g. Safari private browsing); the outer one is a backstop
      so this script can never throw and block the page.
    -->
    <script>
      try {
        var theme;
        try { theme = JSON.parse(localStorage.getItem('phackle.v1')).settings.theme; } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'paper' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>

    <title>P-hackle — the daily p-hacking game</title>
    <meta
      name="description"
      content="A daily game about how easily data analysis finds what it wants: fork your way to p < 0.05, then face what it cost."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      vite-plugin-pwa's own `vite build` transform also injects this exact
      tag unconditionally whenever a `manifest` option is configured, so
      `dist/index.html` ends up with two identical copies -- harmless (a
      document's second identical <link rel="manifest"> is simply ignored).
      This hand-written copy is the one that matters for `vite dev` (the
      plugin skips its own injection there unless devOptions.enabled) and
      for tests/ui/meta.test.ts, which asserts against this source file
      rather than a build output.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="P-hackle — the daily p-hacking game" />
    <meta
      property="og:description"
      content="A daily game about how easily data analysis finds what it wants: fork your way to p < 0.05, then face what it cost."
    />
    <meta property="og:image" content="https://phackle.carlosrodriguezpardo.es/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
